# Deploy incrementale via FTP dei file modificati su main.
# Pubblica in FTPS (TLS esplicito): richiede security=strict e FTP_SERVER all'hostname
# del certificato, non all'IP. Vedi AGENT.md.
name: Deploy FTP

on:
  push:
    branches: [main]
  workflow_dispatch:          # avvio manuale dalla tab Actions
    inputs:
      dry_run:
        description: "Simula senza caricare"
        type: boolean
        default: true
      server_dir:
        description: "Cartella remota di destinazione (deve finire con /). Lasciare _deploytest/ per provare senza toccare il sito; './' pubblica sul sito reale"
        type: string
        default: "_deploytest/"
      protocol:
        description: "Protocollo. ftps funziona solo con security=strict e FTP_SERVER all'hostname del certificato, non all'IP (vedi AGENT.md); ftps-legacy ha la 990 chiusa"
        type: choice
        options: [ftp, ftps, ftps-legacy]
        default: ftps
      port:
        description: "Porta FTP. Vuoto = default dell'action (21). Per ftps-legacy serve 990"
        type: string
        default: ""
      security:
        description: "Verifica del certificato TLS: strict la pretende valida e serve al riuso della sessione TLS sul canale dati (richiede che FTP_SERVER sia l'hostname del certificato, non un IP); loose la ignora"
        type: choice
        options: [strict, loose]
        default: strict
      log_level:
        description: "Verbosita del log: verbose mostra il dialogo FTP comando per comando"
        type: choice
        options: [standard, verbose, minimal]
        default: standard

# evita due deploy sovrapposti
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # il CSS pubblicato (assets/css/main.css) e' generato da Tailwind:
      # lo si rigenera qui perche' corrisponda sempre all'HTML committato
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS (Tailwind)
        run: npm run build

      - name: Upload FTP (solo file cambiati)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # 'ftps' = TLS esplicito sulla 21. Funziona solo insieme a security=strict e a
          # FTP_SERVER impostato all'hostname del certificato: con l'IP la verifica non puo'
          # passare, e senza verifica Node 24 rifiuta di riusare la sessione TLS sul canale
          # dati (CVE-2026-48934) e il server scarta la connessione. Vedi AGENT.md.
          protocol: ${{ github.event_name == 'workflow_dispatch' && inputs.protocol || 'ftps' }}
          # vuoto -> l'action usa il suo default (21); serve solo per ftps-legacy (990)
          port: ${{ github.event_name == 'workflow_dispatch' && inputs.port || '' }}
          local-dir: ./
          # push su main -> sito reale; run manuale -> la cartella scelta negli input
          # (la root di login FTP coincide con la document root: nessun prefisso.
          #  Se cambiasse, sostituire './' qui sotto con es. httpdocs/)
          server-dir: ${{ github.event_name == 'workflow_dispatch' && inputs.server_dir || './' }}
          # strict = rejectUnauthorized: true. Senza una identita' verificata del server,
          # Node >= 22.23/24.17/26.3.1 rifiuta di riusare la sessione TLS sul canale dati
          # (CVE-2026-48934) e ProFTPD scarta la connessione dati non ripresa.
          security: ${{ github.event_name == 'workflow_dispatch' && inputs.security || 'strict' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: ${{ github.event_name == 'workflow_dispatch' && inputs.log_level || 'standard' }}
          timeout: 60000            # 60s: gli hosting condivisi a volte sono lenti ad aprire il canale dati
          # file di sviluppo e toolchain da non pubblicare
          # (specificare exclude sostituisce i default, quindi vanno ripetuti)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .claude/**
            node_modules/**
            dist/**
            backlog/**
            bak/**
            **/.gitkeep
            package.json
            package-lock.json
            tailwind.config.js
            assets/css/input.css
            assets/content.md
            assets/project-summary.md
            assets/privacy-policy.md
            assets/privacy-policy-summary.md
            assets/Screenshot_v_2_0_b2.png
            CLAUDE.md
            AGENT.md
            SPECS.md
            README.md
            prompt.md
